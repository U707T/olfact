name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_adblock:
        description: "同时编 libadblock_ffi.so（需要 B4 的 rust crate 已入库）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── 单元测试：六个模块的纯 JVM 用例（web 的真联网用例默认跳过）────────────
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 沙箱里 aapt2 走 qemu 包装；CI 是 x86_64，用官方 aapt2 即可
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7
          if-no-files-found: ignore

  # ── 主构建：debug APK（ABI split，产物是多个文件）────────────────────────
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # ABI split 开启后没有 app-debug.apk，只有 app-<abi>-debug.apk，这里必须用通配
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olfact-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── 发版：打 tag v* 时签名 release 并创建 GitHub Release ──────────────────
  release:
    name: assembleRelease + publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.OLFACT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OLFACT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OLFACT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OLFACT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$GITHUB_WORKSPACE/keystore.properties"

      - name: Build release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "详见 CHANGELOG.md" > release-notes.md; fi

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: olfact-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true

  # ── B4 的 adblock-rust 交叉编译（默认不跑，手动触发；crate 未入库前不阻塞主干）──
  build-adblock-rust:
    name: libadblock_ffi.so (arm64-v8a + armeabi-v7a)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_adblock }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      # crate 路径由 B4 提供（默认 core/adblock/rust），产物直接进 app 的 jniLibs
      - name: Build .so
        working-directory: core/adblock/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../../../app/src/main/jniLibs build --release

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libadblock-ffi
          path: app/src/main/jniLibs/**/libadblock_ffi.so
          if-no-files-found: warn
          retention-days: 14

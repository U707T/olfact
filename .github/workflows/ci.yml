name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_adblock:
        description: "同时编 libadblock_ffi.so（需要 B4 的 rust crate 已入库）"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 主构建：debug APK，全部批次共用的"能不能编过"闸门 ─────────────────
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0 platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olfact-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # ── B4 的 adblock-rust 交叉编译（默认不跑，手动触发；crate 未入库前不阻塞主干）──
  build-adblock-rust:
    name: libadblock_ffi.so (arm64-v8a + armeabi-v7a)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_adblock }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "ndk;28.2.13676358"

      # crate 路径由 B4 提供（默认 core/adblock/rust），产物直接进 app 的 jniLibs
      - name: Build .so
        working-directory: core/adblock/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../../../app/src/main/jniLibs build --release

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libadblock-ffi
          path: app/src/main/jniLibs/**/libadblock_ffi.so
          if-no-files-found: warn
          retention-days: 14


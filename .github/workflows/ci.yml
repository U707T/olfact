name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_adblock:
        description: "同时编 libadblock_ffi.so（需要 B4 的 rust crate 已入库）"
        type: boolean
        default: false
  # 每周一 03:00 UTC 跑一次完整 CI（含 lint）
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ── 单元测试：六个模块的纯 JVM 用例（web 的真联网用例默认跳过）────────────
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # runner 镜像已预装 platforms;android-37.x 与 build-tools;37.0.0；
      # setup-android@v3 在本环境会因为 `sdkmanager tools` 引导包不存在而失败，故直接用预装 SDK。
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" | tr '\n' ' '; echo

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 沙箱里 aapt2 走 qemu 包装；CI 是 x86_64，用官方 aapt2 即可
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/**"
          retention-days: 7
          if-no-files-found: ignore

  # ── 静态检查：Android Lint（0 error 才放行；warning 只存档不拦）──────────
  # AGP 9 的 :app:lintDebug 在 GitHub runner 冷缓存下要 60 分钟以上（6 个模块全量分析），
  # 每次 push 都跑会把整条流水线拖到一个小时。改为 PR / 手动 / 每周定时跑；
  # push 仍保留单测 + assembleDebug。本地提交前请自己跑一遍（见 README「构建」）。
  lint:
    name: lint (${{ matrix.module }})
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # 按模块并行：app 要分析全部依赖模块（AGP 9 的 lint 模型是工程级的），给它 90 分钟兜底；
    # 其余模块各自分析自己，45 分钟足够。某个模块超时不再拖垮其它模块的报告。
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: app
            timeout: 90
          - module: core
            timeout: 45
          - module: web
            timeout: 45
          - module: player
            timeout: 45
          - module: download
            timeout: 45
          - module: ai
            timeout: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android Lint (${{ matrix.module }})
        run: ./gradlew :${{ matrix.module }}:lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ matrix.module }}
          path: |
            ${{ matrix.module }}/build/reports/lint-results-debug.html
            ${{ matrix.module }}/build/reports/lint-results-debug.xml
          retention-days: 7
          if-no-files-found: warn

  # ── 主构建：debug APK（ABI split，产物是多个文件）────────────────────────
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # runner 镜像已预装 platforms;android-37.x 与 build-tools;37.0.0；
      # setup-android@v3 在本环境会因为 `sdkmanager tools` 引导包不存在而失败，故直接用预装 SDK。
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" | tr '\n' ' '; echo

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # ABI split 开启后没有 app-debug.apk，只有 app-<abi>-debug.apk，这里必须用通配
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: olfact-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── 发版：打 tag v* 时签名 release 并创建 GitHub Release ──────────────────
  release:
    name: assembleRelease + publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # runner 镜像已预装 platforms;android-37.x 与 build-tools;37.0.0；
      # setup-android@v3 在本环境会因为 `sdkmanager tools` 引导包不存在而失败，故直接用预装 SDK。
      - name: Use preinstalled Android SDK
        run: |
          set -euo pipefail
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          ls "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/platforms" | tr '\n' ' '; echo

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.OLFACT_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.OLFACT_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OLFACT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OLFACT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > "$GITHUB_WORKSPACE/keystore.properties" <<EOF
          storeFile=$GITHUB_WORKSPACE/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 "$GITHUB_WORKSPACE/keystore.properties"

      - name: Build release
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify --print-certs "$apk"
          done

      - name: Extract release notes
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^## \[/ {exit}
            flag {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "详见 CHANGELOG.md" > release-notes.md; fi

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: olfact-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          fail_on_unmatched_files: true

  # ── B4 的 adblock-rust 交叉编译（默认不跑，手动触发；crate 未入库前不阻塞主干）──
  build-adblock-rust:
    name: libadblock_ffi.so (arm64-v8a + armeabi-v7a)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_adblock }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Set up Android NDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358"

      # crate 路径由 B4 提供（默认 core/adblock/rust），产物直接进 app 的 jniLibs
      - name: Build .so
        working-directory: core/adblock/rust
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/28.2.13676358
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../../../app/src/main/jniLibs build --release

      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: libadblock-ffi
          path: app/src/main/jniLibs/**/libadblock_ffi.so
          if-no-files-found: warn
          retention-days: 14

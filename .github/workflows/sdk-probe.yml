name: sdk-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: android-actions/setup-android@v3
      - name: List platforms (stable)
        run: sdkmanager --list 2>/dev/null | grep -E "^\s+platforms;android-3" | tail -20 || true
      - name: List platforms (channel 3)
        run: sdkmanager --list --channel=3 2>/dev/null | grep -E "^\s+platforms;android-3" | tail -20 || true
      - name: List build-tools
        run: sdkmanager --list 2>/dev/null | grep -E "^\s+build-tools;3" | tail -20 || true
      - name: Installed
        run: ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null; ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null

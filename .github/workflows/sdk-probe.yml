name: sdk-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Env
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_SDK_ROOT/platforms" 2>/dev/null || true
          ls "$ANDROID_SDK_ROOT/build-tools" 2>/dev/null || true
      - name: Available packages
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          echo "sdkmanager=$SDKM"
          "$SDKM" --list 2>/dev/null | grep -E "platforms;android-3[0-9]|build-tools;3[0-9]" | sort -u | tail -30 || true
      - name: Available packages (channel 3)
        run: |
          SDKM=$(ls "$ANDROID_SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | tail -1)
          "$SDKM" --list --channel=3 2>/dev/null | grep -E "platforms;android-3[0-9]" | sort -u | tail -20 || true

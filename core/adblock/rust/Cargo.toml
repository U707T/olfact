[package]
name = "adblock-ffi"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MPL-2.0"
description = "olfact 浏览器的 adblock-rust JNI/C ABI 壳"

[lib]
name = "adblock_ffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# 引擎本体：Brave adblock-rust
adblock = "0.9"
# JNI 绑定（纯 Rust，不需要 NDK jni.h）
jni = "0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
